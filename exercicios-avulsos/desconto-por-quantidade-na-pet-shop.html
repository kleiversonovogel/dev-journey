<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconto por quantidade na pet shop</title>
</head>
<body>
    <h1>BirdShop: desconto por quantidade para produtos pet</h1>
    <form>
        <p>Nome:
            <input type="text" id="nome" required>
        </p>
        <p>Valor total da compra: 
            <input type="number" min="0" id="valorBruto" required>
        </p>
        <input type="submit" required>
    </form>
    <h3 id="RespNome"></h3>
    <h3 id="RespDesconto"></h3>
    <h3 id="RespValorTotal"></h3>
    <script src="desconto-por-quantidade-na-pet-shop.js"></script>
</body>
</html>
