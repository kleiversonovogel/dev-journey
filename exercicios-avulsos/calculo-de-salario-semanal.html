<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo do salário semanal</title>
</head>
<body>
    <h1>MeuSalário: cálculo do salário semanal</h1>
    <form>
        <p>Seu nome: 
            <input type="text" id="nome">
        </p>
        <p>Digite horas trabalhadas: 
            <input type="number" min="1" id="horas">
        </p>
            <p>Digite o valor por hora: 
                <input type="number" id="valor" min="0">
            </p>
        <input type="submit" required>
    </form>

    <h3 id="nomeresp"></h3>
    <h3 id="salarioresp"></h3>

<script src="calculo-de-salario-semanal.js"></script>
</body>
</html>
